services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: always

    environment:
      # === Zafira Postiz Lab
      MAIN_URL: 'https://postiz.lab.zafiramkt.com.br'
      FRONTEND_URL: 'https://postiz.lab.zafiramkt.com.br'
      NEXT_PUBLIC_BACKEND_URL: 'https://postiz.lab.zafiramkt.com.br/api'

      JWT_SECRET: 'ZafiraPostizLab_9P7m2Qx4Ls8Vn6Kc3Rt5Hw1Bj0Fy7Da'

      DATABASE_URL: 'postgresql://postiz-lab-user:ZafiraPostizLabDb_8Qm7Wk2Np5Xr9@postiz-postgres:5432/postiz-lab-db'
      REDIS_URL: 'redis://postiz-redis:6379'

      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'

      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

      # === Storage
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Social Media APIs
      # LAB: manter vazio.
      # NÃO usar aqui as credenciais Meta do Postiz original que está em revisão.
      X_URL: ''
      X_API_KEY: ''
      X_API_SECRET: ''

      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''

      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''

      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''

      APPLE_CLIENT_ID: ''
      APPLE_TEAM_ID: ''
      APPLE_KEY_ID: ''
      APPLE_PRIVATE_KEY: ''

      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''

      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''

      FACEBOOK_APP_ID: "${921457983917728}"
      FACEBOOK_APP_SECRET: "${9787e7480e7199bf1a6f7ff85e07674f}"

      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''

      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''

      TIKTOK_BUSINESS_CLIENT_ID: ''
      TIKTOK_BUSINESS_CLIENT_SECRET: ''

      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''

      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''

      TUMBLR_CLIENT_ID: ''
      TUMBLR_CLIENT_SECRET: ''

      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''

      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''

      MASTODON_URL: 'https://mastodon.social'
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''

      # === Misc
      OPENAI_API_KEY: ''
      OPENAI_OAUTH_CLIENT_ID: ''

      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''

      API_LIMIT: 30

      # === Payments
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''

      # === Developer
      NX_ADD_PLUGINS: false

    volumes:
      - postiz-lab-config:/config/
      - postiz-lab-uploads:/uploads/

    expose:
      - '5000'

    networks:
      - postiz-lab-network
      - postiz-lab-temporal-network

    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy


  postiz-postgres:
    image: postgres:17-alpine
    restart: always

    environment:
      POSTGRES_PASSWORD: 'ZafiraPostizLabDb_8Qm7Wk2Np5Xr9'
      POSTGRES_USER: 'postiz-lab-user'
      POSTGRES_DB: 'postiz-lab-db'

    volumes:
      - postiz-lab-postgres:/var/lib/postgresql/data

    networks:
      - postiz-lab-network

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postiz-lab-user -d postiz-lab-db'
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  postiz-redis:
    image: redis:7.2
    restart: always

    volumes:
      - postiz-lab-redis:/data

    networks:
      - postiz-lab-network

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5


  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always

    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false

    expose:
      - '9200'

    networks:
      - postiz-lab-temporal-network

    volumes:
      - postiz-lab-temporal-elasticsearch:/usr/share/elasticsearch/data


  temporal-postgresql:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_PASSWORD: 'temporal-lab'
      POSTGRES_USER: 'temporal'

    expose:
      - '5432'

    networks:
      - postiz-lab-temporal-network

    volumes:
      - postiz-lab-temporal-postgres:/var/lib/postgresql/data


  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always

    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch

    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal-lab
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default

    expose:
      - '7233'

    networks:
      - postiz-lab-temporal-network

    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig


  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1

    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233

    networks:
      - postiz-lab-temporal-network

    stdin_open: true
    tty: true

    depends_on:
      - temporal


  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: always

    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://postiz.lab.zafiramkt.com.br

    expose:
      - '8080'

    networks:
      - postiz-lab-temporal-network


volumes:
  postiz-lab-postgres:
  postiz-lab-redis:
  postiz-lab-config:
  postiz-lab-uploads:
  postiz-lab-temporal-postgres:
  postiz-lab-temporal-elasticsearch:


networks:
  postiz-lab-network:
    driver: bridge

  postiz-lab-temporal-network:
    driver: bridge
